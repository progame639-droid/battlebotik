<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BATTLE ARENA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Фикс для инпутов времени и цифр, чтобы текст ВСЕГДА был виден */
        input[type="time"], input[type="number"], select {
            color-scheme: dark; /* Заставляет браузер рендерить внутренние элементы в темной теме */
            color: #ffffff !important;
            background-color: #1f2937 !important;
        }
        /* Кастомный скроллбар для колонок чата, чтобы выглядело опрятно */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: #111827;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between shrink-0">
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r fancy-text from-blue-400 to-purple-500">
            🤖 AI BATTLE ARENA
        </h1>
        <div class="text-xs text-gray-400 font-mono">v2.0 Beta</div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        
        <section class="flex-1 grid grid-cols-1 md:grid-cols-2 p-4 gap-4 h-full overflow-hidden">
            
            <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex flex-col h-full overflow-hidden">
                <div class="p-3 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
                    <span class="font-bold text-blue-400">🔥 Боец #1</span>
                    <select class="bg-gray-800 text-sm rounded px-2 py-1 border border-gray-700 focus:outline-none focus:border-blue-500">
                        <option>Google Gemini</option>
                        <option>ChatGPT 4o</option>
                        <option>Claude 3.5 Sonnet</option>
                    </select>
                </div>
                <div class="chat-scroll flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-gray-950/40">
                    <div class="bg-blue-950/30 border border-blue-900/50 p-3 rounded-lg max-w-[85%]">
                        <p class="text-xs text-blue-400 font-semibold mb-1">Gemini:</p>
                        Привет! Я готов к баттлу. Жду твой промпт в панели справа.
                    </div>
                    </div>
            </div>

            <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex flex-col h-full overflow-hidden">
                <div class="p-3 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
                    <span class="font-bold text-purple-400">🔥 Боец #2</span>
                    <select class="bg-gray-800 text-sm rounded px-2 py-1 border border-gray-700 focus:outline-none focus:border-purple-500">
                        <option>Cohere Command R</option>
                        <option>Llama 3.1</option>
                        <option>Mistral Large</option>
                    </select>
                </div>
                <div class="chat-scroll flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-gray-950/40">
                    <div class="bg-purple-950/30 border border-purple-900/50 p-3 rounded-lg max-w-[85%]">
                        <p class="text-xs text-purple-400 font-semibold mb-1">Cohere:</p>
                        Погнали, покажем на что способны локальные и облачные веса!
                    </div>
                    </div>
            </div>

        </section>

        <aside class="w-80 bg-gray-900 border-l border-gray-800 p-4 flex flex-col justify-between shrink-0 h-full">
            
            <div class="space-y-4">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Настройки боя</h3>
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Время раунда / Тайм-аут</label>
                    <input type="time" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500" value="00:30">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Количество эпох / итераций</label>
                    <input type="number" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500" value="1" min="1">
                </div>
            </div>

            <div class="space-y-3 mt-auto">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Твой боевой промпт</label>
                    <textarea class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 resize-none h-28" placeholder="Напиши тему для спора ботов..."></textarea>
                </div>

                <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-purple-900/20 active:scale-[0.98]">
                    🚀 ЗАПУСТИТЬ БИТВУ
                </button>
                
                <button class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2 px-4 rounded-xl border border-gray-700 transition text-sm">
                    🧹 Сбросить арену
                </button>
            </div>

        </aside>

    </main>

</body>
</html>
